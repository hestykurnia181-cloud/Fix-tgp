name: TGP Management - Android & iOS

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgp-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:

  # ============================================================
  # ANDROID APK
  # ============================================================
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT GITHUB
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. SETUP NODE
      #
      # JANGAN menggunakan cache: npm
      # karena package-lock.json berada di dalam ZIP.
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------------
      # 3. EXTRACT ZIP PROJECT
      # --------------------------------------------------------
      - name: Extract TGP project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "MENCARI ZIP PROJECT TGP"
          echo "=============================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan di root repository."
            echo ""
            echo "File yang tersedia:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          rm -rf _tgp_extract project
          mkdir -p _tgp_extract
          mkdir -p project

          echo ""
          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d _tgp_extract

          echo ""
          echo "Mencari package.json..."

          PACKAGE_JSON=$(find _tgp_extract \
            -type f \
            -name "package.json" \
            -print \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan di dalam ZIP."
            echo ""
            echo "Isi ZIP:"
            find _tgp_extract -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE_JSON")

          echo "package.json ditemukan:"
          echo "$PACKAGE_JSON"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Menyiapkan project root..."

          cp -a "$PROJECT_ROOT"/. project/

          echo ""
          echo "Project berhasil diekstrak."

          echo ""
          echo "Isi project:"
          ls -lah project

      # --------------------------------------------------------
      # 4. VERIFY PROJECT
      # --------------------------------------------------------
      - name: Verify extracted project
        shell: bash
        run: |
          set -e

          if [ ! -f "project/package.json" ]; then
            echo "ERROR: project/package.json tidak ditemukan."
            exit 1
          fi

          if [ ! -f "project/capacitor.config.ts" ]; then
            echo "ERROR: capacitor.config.ts tidak ditemukan."
            exit 1
          fi

          echo "=============================================="
          echo "PROJECT VALID"
          echo "=============================================="

          echo ""
          echo "package.json:"
          cat project/package.json

      # --------------------------------------------------------
      # 5. SETUP JAVA
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # --------------------------------------------------------
      # 6. ANDROID SDK
      # --------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------------
      # 7. INSTALL NPM DEPENDENCIES
      #
      # IMPORTANT:
      # Menggunakan npm install, BUKAN npm ci.
      #
      # Karena repository hanya berisi ZIP.
      # package-lock.json berada di dalam ZIP.
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: project
        run: |
          npm install --no-audit --no-fund

      # --------------------------------------------------------
      # 8. VERIFY SUPABASE
      # --------------------------------------------------------
      - name: Verify Supabase configuration
        working-directory: project
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum diset."
            echo "Tambahkan GitHub Secret:"
            echo "VITE_SUPABASE_URL"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY belum diset."
            echo "Tambahkan GitHub Secret:"
            echo "VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

          echo "Supabase configuration detected."

      # --------------------------------------------------------
      # 9. LINT
      # --------------------------------------------------------
      - name: Run lint
        working-directory: project
        run: npm run lint

      # --------------------------------------------------------
      # 10. BUILD WEB
      # --------------------------------------------------------
      - name: Build web application
        working-directory: project
        run: npm run build

      # --------------------------------------------------------
      # 11. ADD CAPACITOR ANDROID
      # --------------------------------------------------------
      - name: Add Capacitor Android
        working-directory: project
        run: |
          npx cap add android

      # --------------------------------------------------------
      # 12. SYNC CAPACITOR ANDROID
      # --------------------------------------------------------
      - name: Sync Capacitor Android
        working-directory: project
        run: |
          npx cap sync android

      # --------------------------------------------------------
      # 13. VERIFY ANDROID PROJECT
      # --------------------------------------------------------
      - name: Verify Android project
        working-directory: project
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew tidak ditemukan."
            exit 1
          fi

          echo "Android project OK."

      # --------------------------------------------------------
      # 14. BUILD APK
      # --------------------------------------------------------
      - name: Build Android Debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # --------------------------------------------------------
      # 15. VERIFY APK
      # --------------------------------------------------------
      - name: Verify Android APK
        working-directory: project
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      # --------------------------------------------------------
      # 16. PREPARE ARTIFACT
      # --------------------------------------------------------
      - name: Prepare Android artifact
        working-directory: project
        run: |
          mkdir -p artifacts/android

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/android/TGP-Management-Android.apk

      # --------------------------------------------------------
      # 17. UPLOAD APK
      # --------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-Android-APK
          path: project/artifacts/android/TGP-Management-Android.apk
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # IOS SIMULATOR
  # ============================================================
  ios:
    name: Build iOS Simulator
    runs-on: macos-15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. SETUP NODE
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------------
      # 3. EXTRACT ZIP
      # --------------------------------------------------------
      - name: Extract TGP project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "MENCARI ZIP PROJECT TGP"
          echo "=============================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          rm -rf _tgp_extract project
          mkdir -p _tgp_extract
          mkdir -p project

          unzip -q "$ZIP_FILE" -d _tgp_extract

          PACKAGE_JSON=$(find _tgp_extract \
            -type f \
            -name "package.json" \
            -print \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan di ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE_JSON")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. project/

          echo "Project berhasil diekstrak."

      # --------------------------------------------------------
      # 4. VERIFY PROJECT
      # --------------------------------------------------------
      - name: Verify extracted project
        shell: bash
        run: |
          set -e

          if [ ! -f "project/package.json" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          if [ ! -f "project/capacitor.config.ts" ]; then
            echo "ERROR: capacitor.config.ts tidak ditemukan."
            exit 1
          fi

          echo "Project valid."

      # --------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: project
        run: |
          npm install --no-audit --no-fund

      # --------------------------------------------------------
      # 6. VERIFY SUPABASE
      # --------------------------------------------------------
      - name: Verify Supabase configuration
        working-directory: project
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum diset."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY belum diset."
            exit 1
          fi

          echo "Supabase configuration detected."

      # --------------------------------------------------------
      # 7. LINT
      # --------------------------------------------------------
      - name: Run lint
        working-directory: project
        run: npm run lint

      # --------------------------------------------------------
      # 8. BUILD WEB
      # --------------------------------------------------------
      - name: Build web application
        working-directory: project
        run: npm run build

      # --------------------------------------------------------
      # 9. ADD CAPACITOR IOS
      # --------------------------------------------------------
      - name: Add Capacitor iOS
        working-directory: project
        run: |
          npx cap add ios

      # --------------------------------------------------------
      # 10. SYNC CAPACITOR IOS
      # --------------------------------------------------------
      - name: Sync Capacitor iOS
        working-directory: project
        run: |
          npx cap sync ios

      # --------------------------------------------------------
      # 11. SHOW XCODE
      # --------------------------------------------------------
      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      # --------------------------------------------------------
      # 12. BUILD IOS SIMULATOR
      #
      # Unsigned build = untuk simulator.
      # BUKAN IPA untuk iPhone fisik.
      # --------------------------------------------------------
      - name: Build iOS Simulator
        working-directory: project
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # --------------------------------------------------------
      # 13. VERIFY IOS APP
      # --------------------------------------------------------
      - name: Verify iOS App
        working-directory: project
        run: |
          APP_PATH="build/ios/Build/Products/Debug-iphonesimulator/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app tidak ditemukan."

            echo ""
            echo "Hasil build:"
            find build/ios \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "iOS App berhasil dibuat:"
          ls -ld "$APP_PATH"

      # --------------------------------------------------------
      # 14. PACKAGE IOS
      # --------------------------------------------------------
      - name: Package iOS Simulator artifact
        working-directory: project
        run: |
          mkdir -p artifacts/ios

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            artifacts/ios/TGP-Management-iOS-Simulator.app.zip

      # --------------------------------------------------------
      # 15. VERIFY IOS ARTIFACT
      # --------------------------------------------------------
      - name: Verify iOS artifact
        working-directory: project
        run: |
          FILE="artifacts/ios/TGP-Management-iOS-Simulator.app.zip"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: iOS artifact tidak ditemukan."
            exit 1
          fi

          echo "iOS artifact berhasil dibuat:"
          ls -lh "$FILE"

      # --------------------------------------------------------
      # 16. UPLOAD IOS
      # --------------------------------------------------------
      - name: Upload iOS Simulator
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-iOS-Simulator
          path: project/artifacts/ios/TGP-Management-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # FINAL VERIFICATION
  # ============================================================
  verify:
    name: Verify Android + iOS
    runs-on: ubuntu-latest

    needs:
      - android
      - ios

    if: ${{ always() }}

    steps:

      - name: Check build results
        run: |
          echo "=============================================="
          echo "       TGP MANAGEMENT MOBILE BUILD"
          echo "=============================================="
          echo ""

          echo "Android job : ${{ needs.android.result }}"
          echo "iOS job     : ${{ needs.ios.result }}"
          echo ""

          if [ "${{ needs.android.result }}" != "success" ]; then
            echo "ERROR: Android build gagal."
            exit 1
          fi

          if [ "${{ needs.ios.result }}" != "success" ]; then
            echo "ERROR: iOS build gagal."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "BUILD BERHASIL"
          echo "=============================================="
          echo ""
          echo "Android:"
          echo "TGP-Management-Android-APK"
          echo ""
          echo "iOS:"
          echo "TGP-Management-iOS-Simulator"
          echo ""
          echo "Supabase:"
          echo "Configuration tersedia."
