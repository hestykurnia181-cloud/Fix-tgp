name: TGP Management - Android & iOS

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf _extract project

          mkdir -p _extract
          mkdir -p project

          unzip -q "$ZIP" -d _extract

          PACKAGE=$(find _extract -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan dalam ZIP."
            exit 1
          fi

          ROOT=$(dirname "$PACKAGE")

          echo "Project root: $ROOT"

          cp -a "$ROOT"/. project/

      - name: Patch project
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # -----------------------------------------------
          # Capacitor config
          # -----------------------------------------------

          p = Path("project/capacitor.config.ts")

          if not p.exists():
              raise SystemExit("capacitor.config.ts tidak ditemukan")

          text = p.read_text()

          text = text.replace(
              "  bundledWebRuntime: false,\n",
              ""
          )

          p.write_text(text)

          print("Capacitor config patched.")


          # -----------------------------------------------
          # Bottom bar OWNER narrowing
          # -----------------------------------------------

          p = Path("project/src/components/TgpBottomBar.tsx")

          if not p.exists():
              raise SystemExit("TgpBottomBar.tsx tidak ditemukan")

          text = p.read_text()

          old = """    if (role === UserRole.OWNER || role === UserRole.ADMIN_OWNER || role === UserRole.ADMIN_DIVISI) {"""

          new = """    if (role === UserRole.ADMIN_OWNER || role === UserRole.ADMIN_DIVISI) {"""

          if old in text:
              text = text.replace(old, new)
              print("OWNER check patched.")
          else:
              print("OWNER check pattern not found; leaving source unchanged.")

          p.write_text(text)
          PY

      - name: Verify project
        run: |
          test -f project/package.json
          test -f project/capacitor.config.ts
          echo "Project OK"

      - name: Install dependencies
        working-directory: project
        run: |
          npm install --no-audit --no-fund

      - name: Verify Supabase
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          echo "Supabase configuration OK"

      - name: Lint
        working-directory: project
        run: |
          npm run lint

      - name: Build web
        working-directory: project
        run: |
          npm run build

      - name: Add Android
        working-directory: project
        run: |
          npx cap add android

      - name: Sync Android
        working-directory: project
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f project/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-Android-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


  ios:
    name: Build iOS Simulator
    runs-on: macos-15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -lah
            exit 1
          fi

          rm -rf _extract project

          mkdir -p _extract
          mkdir -p project

          unzip -q "$ZIP" -d _extract

          PACKAGE=$(find _extract -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          ROOT=$(dirname "$PACKAGE")

          echo "Project root: $ROOT"

          cp -a "$ROOT"/. project/

      - name: Patch project
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("project/capacitor.config.ts")

          text = p.read_text()

          text = text.replace(
              "  bundledWebRuntime: false,\n",
              ""
          )

          p.write_text(text)

          p = Path("project/src/components/TgpBottomBar.tsx")

          text = p.read_text()

          old = """    if (role === UserRole.OWNER || role === UserRole.ADMIN_OWNER || role === UserRole.ADMIN_DIVISI) {"""

          new = """    if (role === UserRole.ADMIN_OWNER || role === UserRole.ADMIN_DIVISI) {"""

          if old in text:
              text = text.replace(old, new)

          p.write_text(text)
          PY

      - name: Verify project
        run: |
          test -f project/package.json
          test -f project/capacitor.config.ts
          echo "Project OK"

      - name: Install dependencies
        working-directory: project
        run: |
          npm install --no-audit --no-fund

      - name: Verify Supabase
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          echo "Supabase configuration OK"

      - name: Lint
        working-directory: project
        run: |
          npm run lint

      - name: Build web
        working-directory: project
        run: |
          npm run build

      - name: Add iOS
        working-directory: project
        run: |
          npx cap add ios

      - name: Sync iOS
        working-directory: project
        run: |
          npx cap sync ios

      - name: Show Xcode
        run: |
          xcodebuild -version

      - name: Build iOS Simulator
        working-directory: project
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify iOS
        run: |
          test -d project/build/ios/Build/Products/Debug-iphonesimulator/App.app
          echo "iOS Simulator app OK"

      - name: Package iOS
        working-directory: project
        run: |
          mkdir -p artifacts

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            artifacts/TGP-Management-iOS-Simulator.app.zip

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-iOS-Simulator
          path: project/artifacts/TGP-Management-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 30


  verify:
    name: Verify Android + iOS
    runs-on: ubuntu-latest

    needs:
      - android
      - ios

    if: always()

    steps:

      - name: Verify results
        run: |
          echo "Android = ${{ needs.android.result }}"
          echo "iOS     = ${{ needs.ios.result }}"

          if [ "${{ needs.android.result }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ needs.ios.result }}" != "success" ]; then
            exit 1
          fi

          echo "================================"
          echo "TGP MANAGEMENT BUILD SUCCESS"
          echo "================================"
