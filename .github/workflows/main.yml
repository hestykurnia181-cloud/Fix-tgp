name: TGP Management - Android & iOS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/android/TGP-Management-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-Android-APK
          path: artifacts/android/TGP-Management-Android.apk
          retention-days: 14


  ios:
    name: Build iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS Simulator App
        run: |
          mkdir -p artifacts/ios

          APP_PATH=$(find build/ios/Build/Products \
            -type d \
            -name "App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app tidak ditemukan"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            artifacts/ios/TGP-Management-iOS-Simulator.app.zip

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-iOS-Simulator
          path: artifacts/ios/TGP-Management-iOS-Simulator.app.zip
          retention-days: 14


  verify:
    name: Verify Project
    runs-on: ubuntu-latest
    needs:
      - android
      - ios

    steps:
      - name: Build completed
        run: |
          echo "===================================="
          echo " TGP MANAGEMENT MOBILE BUILD SUCCESS "
          echo "===================================="
          echo ""
          echo "Android artifact:"
          echo "TGP-Management-Android-APK"
          echo ""
          echo "iOS artifact:"
          echo "TGP-Management-iOS-Simulator"
