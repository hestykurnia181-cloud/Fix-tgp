name: Ekstrak ZIP, Supabase Online & Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase Project URL (contoh: https://xxxx.supabase.co)'
        required: false
        default: ''
      supabase_anon_key:
        description: 'Supabase Anon Key (eyJhbGci...)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: 🚀 Proses ZIP, Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 2. Deteksi & Ekstrak File ZIP Otomatis (Jika Ada)
        run: |
          echo "🔍 Memeriksa apakah ada file .zip di repositori..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "📦 Ditemukan file arsip: $ZIP_FILE. Mengekstrak sekarang..."
            mkdir -p temp_zip_extracted
            unzip -q -o "$ZIP_FILE" -d temp_zip_extracted

            # Cari letak package.json di dalam hasil ekstrak
            PKG_DIR=$(find temp_zip_extracted -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$PKG_DIR" ]; then
              echo "Memindahkan berkas dari $PKG_DIR ke root repositori..."
              if [ -d "$PKG_DIR/.github" ]; then
                mkdir -p .github/workflows
                cp -rf "$PKG_DIR/.github/workflows/"* .github/workflows/ 2>/dev/null || true
                rm -rf "$PKG_DIR/.github"
              fi
              cp -rT "$PKG_DIR" .
            else
              cp -rT temp_zip_extracted .
            fi
            rm -rf temp_zip_extracted
            echo "✅ Ekstraksi ZIP selesai!"
          else
            echo "ℹ️ Tidak ada file .zip. Menggunakan file yang sudah ada di repositori."
          fi

      - name: 🔍 3. Verifikasi Keberadaan Proyek
        run: |
          if [ ! -f "package.json" ]; then
            echo "❌ ERROR: File 'package.json' tidak ditemukan di root repositori!"
            echo "Pastikan Anda sudah mengunggah file ZIP dari AI Studio ke repositori ini."
            ls -la
            exit 1
          fi
          echo "✅ Proyek valid (package.json ditemukan)."

      - name: 🔑 4. Siapkan Kredensial Supabase (.env)
        env:
          INPUT_URL: ${{ github.event.inputs.supabase_url }}
          INPUT_KEY: ${{ github.event.inputs.supabase_anon_key }}
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VAR_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          FINAL_URL="${INPUT_URL:-${SECRET_URL:-$VAR_URL}}"
          FINAL_KEY="${INPUT_KEY:-${SECRET_KEY:-$VAR_KEY}}"

          if [ -z "$FINAL_URL" ] && [ -f ".env" ]; then
            FINAL_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" || true)
          fi
          if [ -z "$FINAL_KEY" ] && [ -f ".env" ]; then
            FINAL_KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" || true)
          fi

          if [ -n "$FINAL_URL" ] && [ -n "$FINAL_KEY" ]; then
            echo "✅ Kredensial Supabase terpasang! Menulis ke .env dan .env.production..."
            echo "VITE_SUPABASE_URL=$FINAL_URL" > .env
            echo "VITE_SUPABASE_ANON_KEY=$FINAL_KEY" >> .env
            cp .env .env.production
          else
            echo "⚠️ Catatan: Kredensial Supabase belum diisi. Aplikasi tetap berjalan dan bisa dihubungkan via menu Pengaturan."
          fi

      - name: 🟢 5. Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: ☕ 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 7. Setup Android SDK Command-line Tools
        uses: android-actions/setup-android@v3

      - name: 📦 8. Install Dependensi & Capacitor
        run: |
          npm install --legacy-peer-deps || npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: 🌐 9. Build Web Application (dist/)
        run: npm run build

      - name: 🤖 10. Inisialisasi Capacitor & Build Android APK
        run: |
          echo "📱 Setup Platform Android..."
          npx cap init "TGP Management" "com.tgp.management" --web-dir dist 2>/dev/null || true
          npx cap add android 2>/dev/null || echo "Folder android sudah ada."
          npx cap sync android

          echo "🔧 Memperbaiki konfigurasi Gradle..."
          echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
          echo "android.enableJetifier=true" >> android/gradle.properties

          echo "🔨 Mengompilasi APK Debug..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

          mkdir -p output_builds
          cp android/app/build/outputs/apk/debug/app-debug.apk output_builds/TGP-Management-Online.apk
          zip -r output_builds/tgp-management-web.zip dist/
          echo "✅ File APK dan Web ZIP siap!"
          ls -lh output_builds/

      - name: 📤 11. Upload Artifact Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-APK
          path: output_builds/TGP-Management-Online.apk
          retention-days: 30

      - name: 📤 12. Upload Artifact Web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-Web
          path: output_builds/tgp-management-web.zip
          retention-days: 30

      - name: 🚀 13. Deploy Web ke GitHub Pages (Online di Web Browser)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: 🏷️ 14. Buat GitHub Release Otomatis (Link Download Langsung)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release TGP Management v1.0.${{ github.run_number }}
          body: |
            ## 🚀 TGP Management - Build Online Siap Pakai
            - **Android APK**: Unduh `TGP-Management-Online.apk` untuk HP Android.
            - **Web ZIP**: Unduh `tgp-management-web.zip` untuk hosting Web / cPanel / Vercel.
          files: |
            output_builds/TGP-Management-Online.apk
            output_builds/tgp-management-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
