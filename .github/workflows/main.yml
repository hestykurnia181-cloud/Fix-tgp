name: Ekstrak ZIP, Supabase Online & Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase Project URL (contoh: https://xxxx.supabase.co)'
        required: false
        default: ''
      supabase_anon_key:
        description: 'Supabase Anon Key (eyJhbGci...)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: 🚀 Proses ZIP, Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 2. Deteksi & Ekstrak ZIP TERBARU
        run: |
          echo "🔍 Mencari file .zip terbaru..."
          
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -n "$ZIP_FILE" ]; then
            echo "📦 ZIP terbaru ditemukan: $ZIP_FILE"
            echo "📦 Mengekstrak..."
            rm -rf temp_zip_extracted
            mkdir -p temp_zip_extracted
            unzip -q -o "$ZIP_FILE" -d temp_zip_extracted

            # Cari package.json di hasil ekstrak
            PKG_DIR=$(find temp_zip_extracted -name "package.json" -exec dirname {} \; | head -n 1)

            if [ -n "$PKG_DIR" ]; then
              echo "📁 Folder proyek ditemukan: $PKG_DIR"
              
              # Hapus file lama di root agar tidak nyampur dengan versi sebelumnya
              find . -maxdepth 1 -type f ! -name "*.zip" -delete || true
              find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "temp_zip_extracted" -exec rm -rf {} + 2>/dev/null || true

              if [ -d "$PKG_DIR/.github" ]; then
                mkdir -p .github/workflows
                cp -rf "$PKG_DIR/.github/workflows/"* .github/workflows/ 2>/dev/null || true
                rm -rf "$PKG_DIR/.github"
              fi

              cp -rT "$PKG_DIR" .
            else
              echo "📁 package.json tidak ditemukan, pakai isi ekstrak langsung..."
              find . -maxdepth 1 -type f ! -name "*.zip" -delete || true
              cp -rT temp_zip_extracted .
            fi

            rm -rf temp_zip_extracted
            echo "✅ Ekstraksi ZIP terbaru selesai!"
          else
            echo "ℹ️ Tidak ada file .zip. Menggunakan file yang sudah ada di repositori."
          fi

      - name: 🔍 3. Verifikasi Keberadaan Proyek
        run: |
          if [ ! -f "package.json" ]; then
            echo "❌ ERROR: File 'package.json' tidak ditemukan di root repositori!"
            ls -la
            exit 1
          fi
          echo "✅ Proyek valid (package.json ditemukan)."
